name: Load Testing Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

jobs:
  load_test:
    name: Run JMeter Load Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Download and Extract JMeter
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.2.tgz
          tar -xzf apache-jmeter-5.6.2.tgz
          mv apache-jmeter-5.6.2 jmeter
          chmod +x jmeter/bin/jmeter

      - name: Create Results Directory
        run: mkdir -p results

      - name: Run JMeter Load Tests
        run: |
          ./jmeter/bin/jmeter \
            -n \
            -t tests/load_test.jmx \
            -l results/load_test_results.jtl \
            -j results/jmeter.log
          # Run JMeter in Non-GUI mode (required for CI/CD)
          # -n: Non-GUI mode
          # -t: Path to your JMeter test plan
          # -l: Path to save results
      - name: Convert JTL to HTML Report
        run: |
          ./jmeter/bin/jmeter \
            -g results/load_test_results.jtl \
            -o results/html-report

      - name: Upload Load Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-load-test-report
          path: results/
          retention-days: 15
